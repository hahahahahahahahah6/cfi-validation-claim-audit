[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cfi-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented classification-code claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
cfi-validation-claim-audit = "cfi_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["cfi_validation_claim_audit*"]
